name: GameOps CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: gameops
          MYSQL_USER: gameops
          MYSQL_PASSWORD: gameops-pass
          MYSQL_ROOT_PASSWORD: root-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests
        env:
          GAMEOPS_TEST_MYSQL: "1"
          GAMEOPS_MYSQL_HOST: 127.0.0.1
          GAMEOPS_MYSQL_PORT: "3306"
          GAMEOPS_MYSQL_USER: gameops
          GAMEOPS_MYSQL_PASSWORD: gameops-pass
          GAMEOPS_MYSQL_ROOT_USER: root
          GAMEOPS_MYSQL_ROOT_PASSWORD: root-pass

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t gameops-center:${{ github.sha }} .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && vars.ENABLE_GAMEOPS_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GAMEOPS_HOST }}
          username: ${{ secrets.GAMEOPS_USER }}
          key: ${{ secrets.GAMEOPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/gameops-center
            git pull
            docker compose -f deploy/docker/docker-compose.yml up -d --build
