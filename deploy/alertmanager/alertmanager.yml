global:
  resolve_timeout: 5m

route:
  receiver: gameops-center
  group_by:
    - alertname
    - severity
    - region
    - workload_id
  group_wait: 20s
  group_interval: 2m
  repeat_interval: 2h
  routes:
    - receiver: gameops-center
      matchers:
        - severity="critical"
      repeat_interval: 30m
    - receiver: gameops-center
      matchers:
        - severity="warning"
      repeat_interval: 1h

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - region
      - workload_id

receivers:
  - name: gameops-center
    webhook_configs:
      - url: http://gameops-center:8018/api/alertmanager
        send_resolved: true
