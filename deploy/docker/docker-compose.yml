services:
  mysql:
    image: mysql:8.4
    container_name: gameops-mysql
    environment:
      MYSQL_DATABASE: ${GAMEOPS_MYSQL_DATABASE:-gameops}
      MYSQL_USER: ${GAMEOPS_MYSQL_USER:-gameops}
      MYSQL_PASSWORD: ${GAMEOPS_MYSQL_PASSWORD:-gameops-pass}
      MYSQL_ROOT_PASSWORD: ${GAMEOPS_MYSQL_ROOT_PASSWORD:-root-pass}
    command:
      - --slow-query-log=ON
      - --long-query-time=${GAMEOPS_MYSQL_LONG_QUERY_TIME:-1}
      - --log-output=TABLE
    ports:
      - "${GAMEOPS_MYSQL_PUBLISHED_PORT:-3307}:3306"
    volumes:
      - gameops-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${GAMEOPS_MYSQL_ROOT_PASSWORD:-root-pass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  gameops-center:
    build:
      context: ../..
    image: gameops-center:local
    container_name: gameops-center
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8018:8018"
    environment:
      GAMEOPS_MYSQL_HOST: mysql
      GAMEOPS_MYSQL_PORT: 3306
      GAMEOPS_MYSQL_DATABASE: ${GAMEOPS_MYSQL_DATABASE:-gameops}
      GAMEOPS_MYSQL_USER: ${GAMEOPS_MYSQL_USER:-gameops}
      GAMEOPS_MYSQL_PASSWORD: ${GAMEOPS_MYSQL_PASSWORD:-gameops-pass}
      GAMEOPS_MYSQL_MANAGED: ${GAMEOPS_MYSQL_MANAGED:-false}
      GAMEOPS_MYSQL_POOL_SIZE: ${GAMEOPS_MYSQL_POOL_SIZE:-5}
      GAMEOPS_MYSQL_CONNECT_TIMEOUT: ${GAMEOPS_MYSQL_CONNECT_TIMEOUT:-8}
      GAMEOPS_MYSQL_READ_TIMEOUT: ${GAMEOPS_MYSQL_READ_TIMEOUT:-15}
      GAMEOPS_MYSQL_WRITE_TIMEOUT: ${GAMEOPS_MYSQL_WRITE_TIMEOUT:-15}
      GAMEOPS_MYSQL_SLOW_QUERY_SECONDS: ${GAMEOPS_MYSQL_SLOW_QUERY_SECONDS:-1.0}
      GAMEOPS_HOST: 0.0.0.0
      GAMEOPS_RUNTIME: kubernetes
      GAMEOPS_DRY_RUN: ${GAMEOPS_DRY_RUN:-true}
      GAMEOPS_TRUSTED_RUNTIME: ${GAMEOPS_TRUSTED_RUNTIME:-false}
      GAMEOPS_LOCAL_LOGIN_ENABLED: ${GAMEOPS_LOCAL_LOGIN_ENABLED:-true}
      GAMEOPS_CHANGE_WINDOW: ${GAMEOPS_CHANGE_WINDOW:-}
      GAMEOPS_OIDC_ISSUER: ${GAMEOPS_OIDC_ISSUER:-}
      GAMEOPS_OIDC_CLIENT_ID: ${GAMEOPS_OIDC_CLIENT_ID:-}
      GAMEOPS_OIDC_JWKS_URL: ${GAMEOPS_OIDC_JWKS_URL:-}
      GAMEOPS_OIDC_ADMIN_GROUP: ${GAMEOPS_OIDC_ADMIN_GROUP:-gameops-admins}
      GAMEOPS_OIDC_RELEASE_GROUP: ${GAMEOPS_OIDC_RELEASE_GROUP:-gameops-release}
      GAMEOPS_WEBHOOK_URL: ${GAMEOPS_WEBHOOK_URL:-}
      GAMEOPS_WECOM_WEBHOOK: ${GAMEOPS_WECOM_WEBHOOK:-}
      GAMEOPS_DINGTALK_WEBHOOK: ${GAMEOPS_DINGTALK_WEBHOOK:-}
      GAMEOPS_SMTP_HOST: ${GAMEOPS_SMTP_HOST:-}
      GAMEOPS_SMTP_PORT: ${GAMEOPS_SMTP_PORT:-25}
      GAMEOPS_SMTP_USER: ${GAMEOPS_SMTP_USER:-}
      GAMEOPS_SMTP_PASSWORD: ${GAMEOPS_SMTP_PASSWORD:-}
      GAMEOPS_MAIL_FROM: ${GAMEOPS_MAIL_FROM:-}
      GAMEOPS_MAIL_TO: ${GAMEOPS_MAIL_TO:-}
      GAMEOPS_LLM_API_KEY: ${GAMEOPS_LLM_API_KEY:-}
      GAMEOPS_LLM_API_BASE: ${GAMEOPS_LLM_API_BASE:-https://api.openai.com/v1}
      GAMEOPS_LLM_MODEL: ${GAMEOPS_LLM_MODEL:-gpt-4.1-mini}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME:-~}/.kube:/home/gameops/.kube:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: gameops-prometheus
    depends_on:
      - gameops-center
      - alertmanager
    ports:
      - "${GAMEOPS_PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${GAMEOPS_PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - gameops-prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: gameops-alertmanager
    depends_on:
      - gameops-center
    ports:
      - "${GAMEOPS_ALERTMANAGER_PORT:-9093}:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - gameops-alertmanager-data:/alertmanager

  grafana:
    image: grafana/grafana:11.3.0
    container_name: gameops-grafana
    depends_on:
      - prometheus
    ports:
      - "${GAMEOPS_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GAMEOPS_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GAMEOPS_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/gameops-overview.json
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
      - gameops-grafana-data:/var/lib/grafana

volumes:
  gameops-mysql-data:
  gameops-prometheus-data:
  gameops-alertmanager-data:
  gameops-grafana-data:
