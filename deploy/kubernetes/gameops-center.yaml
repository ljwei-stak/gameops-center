apiVersion: v1
kind: Namespace
metadata:
  name: gameops
---
apiVersion: v1
kind: Namespace
metadata:
  name: game-prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gameops-center-config
  namespace: gameops
data:
  GAMEOPS_HOST: 0.0.0.0
  GAMEOPS_RUNTIME: kubernetes
  GAMEOPS_DRY_RUN: "true"
  GAMEOPS_TRUSTED_RUNTIME: "false"
  GAMEOPS_LOCAL_LOGIN_ENABLED: "false"
  GAMEOPS_MYSQL_MANAGED: "true"
  GAMEOPS_MYSQL_HOST: prod-mysql.example.rds.amazonaws.com
  GAMEOPS_MYSQL_PORT: "3306"
  GAMEOPS_MYSQL_DATABASE: gameops
  GAMEOPS_MYSQL_USER: gameops_app
  GAMEOPS_MYSQL_POOL_SIZE: "10"
  GAMEOPS_MYSQL_SLOW_QUERY_SECONDS: "0.5"
  GAMEOPS_CHANGE_WINDOW: "01:00-05:00"
  GAMEOPS_OIDC_ISSUER: https://sso.example.com
  GAMEOPS_OIDC_CLIENT_ID: gameops-center
  GAMEOPS_OIDC_JWKS_URL: https://sso.example.com/.well-known/jwks.json
  GAMEOPS_OIDC_ADMIN_GROUP: gameops-admins
  GAMEOPS_OIDC_RELEASE_GROUP: gameops-release
  GAMEOPS_LLM_API_BASE: https://api.openai.com/v1
  GAMEOPS_LLM_MODEL: gpt-4.1-mini
---
apiVersion: v1
kind: Secret
metadata:
  name: gameops-secrets
  namespace: gameops
type: Opaque
stringData:
  mysql-password: change-me
  llm-api-key: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gameops-center
  namespace: gameops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gameops-center-operator
  namespace: game-prod
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gameops-center-operator
  namespace: game-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gameops-center-operator
subjects:
  - kind: ServiceAccount
    name: gameops-center
    namespace: gameops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameops-center
  namespace: gameops
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gameops-center
  template:
    metadata:
      labels:
        app: gameops-center
    spec:
      serviceAccountName: gameops-center
      containers:
        - name: app
          image: registry.example.com/platform/gameops-center:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8018
              name: http
          envFrom:
            - configMapRef:
                name: gameops-center-config
          env:
            - name: GAMEOPS_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gameops-secrets
                  key: mysql-password
            - name: GAMEOPS_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gameops-secrets
                  key: llm-api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gameops-center
  namespace: gameops
  labels:
    app: gameops-center
spec:
  selector:
    app: gameops-center
  ports:
    - name: http
      port: 8018
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gameops-center
  namespace: gameops
spec:
  selector:
    matchLabels:
      app: gameops-center
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
