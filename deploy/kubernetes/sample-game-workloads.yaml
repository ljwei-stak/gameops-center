apiVersion: v1
kind: Namespace
metadata:
  name: game-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arena-east
  namespace: game-prod
  labels:
    app: arena-east
    gameops.region: cn-east
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: arena-east
  template:
    metadata:
      labels:
        app: arena-east
        gameops.region: cn-east
    spec:
      containers:
        - name: arena
          image: registry.example.com/game/arena:v1.8.3
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: arena-east-svc
  namespace: game-prod
  labels:
    app: arena-east
spec:
  selector:
    app: arena-east
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: arena-east
  namespace: game-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arena-east
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
