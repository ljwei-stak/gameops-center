groups:
  - name: gameops.rules
    rules:
      - alert: GameOpsCenterTargetDown
        expr: up{job="gameops-center"} == 0
        for: 1m
        labels:
          severity: critical
          region: platform
        annotations:
          summary: "GameOps Center scrape target is down"
          description: "Prometheus cannot scrape GameOps Center /metrics."
          runbook: "Check the gameops-center container, MySQL connectivity, and application startup logs."

      - alert: GameOpsHighHostCPU
        expr: gameops_host_cpu_percent > 80
        for: 2m
        labels:
          severity: warning
          region: platform
        annotations:
          summary: "GameOps host CPU is high"
          description: "Host CPU has stayed above 80 percent."
          runbook: "Check background jobs, container limits, and scale-out options."

      - alert: GameOpsHighHostMemory
        expr: gameops_host_memory_percent > 85
        for: 2m
        labels:
          severity: warning
          region: platform
        annotations:
          summary: "GameOps host memory is high"
          description: "Host memory has stayed above 85 percent."
          runbook: "Check process memory, cache usage, OOM risk, and MySQL/Grafana resource pressure."

      - alert: GameOpsHighDiskUsage
        expr: gameops_host_disk_percent > 82
        for: 5m
        labels:
          severity: warning
          region: platform
        annotations:
          summary: "GameOps host disk usage is high"
          description: "Disk usage has stayed above 82 percent."
          runbook: "Clean logs, image cache, build artifacts, and review Prometheus retention."

      - alert: GameOpsWorkloadCPUHigh
        expr: gameops_workload_cpu_percent > 75
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Game workload CPU is high"
          description: "{{ $labels.workload_id }} CPU has stayed above 75 percent."
          runbook: "Scale the Deployment first, then review P95 latency and traffic weights."

      - alert: GameOpsWorkloadMemoryHigh
        expr: gameops_workload_memory_percent > 82
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Game workload memory is high"
          description: "{{ $labels.workload_id }} memory has stayed above 82 percent."
          runbook: "Review room objects, session cache, recent releases, and rolling restart options."

      - alert: GameOpsWorkloadLatencyHigh
        expr: gameops_workload_latency_p95_ms > 130
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Game workload P95 latency is high"
          description: "{{ $labels.workload_id }} P95 latency has stayed above 130 ms."
          runbook: "Check cross-region links, battle sync cost, Pod load, and gateway forwarding."

      - alert: GameOpsWorkloadDownOrDegraded
        expr: gameops_workload_status < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Game workload is degraded or unavailable"
          description: "{{ $labels.workload_id }} status value is {{ $value | humanize }}."
          runbook: "Inspect Deployment rollout, Pod events, recent deployments, and container logs."

      - alert: GameOpsCapacityNearLimit
        expr: sum by (workload_id, region, namespace, deployment, service) (gameops_workload_players) / clamp_min(sum by (workload_id, region, namespace, deployment, service) (gameops_workload_capacity), 1) > 0.92
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Game workload capacity is near limit"
          description: "{{ $labels.workload_id }} capacity usage is above 92 percent."
          runbook: "Scale the Deployment and include new capacity in ingress traffic scheduling."

      - alert: GameOpsActiveCriticalAlerts
        expr: gameops_alerts_active{severity="critical"} > 0
        for: 1m
        labels:
          severity: critical
          region: platform
        annotations:
          summary: "GameOps has active critical alerts"
          description: "GameOps currently records critical internal alerts."
          runbook: "Open GameOps Center alerts and let Alertmanager route the notification to the owner."

      - alert: GameOpsDeploymentApprovalStale
        expr: gameops_deployment_approvals_pending > 0
        for: 30m
        labels:
          severity: warning
          region: platform
        annotations:
          summary: "Deployment approvals are waiting too long"
          description: "One or more deployment approvals have been pending for at least 30 minutes."
          runbook: "Ask an administrator to approve or reject the release request before the change window closes."

      - alert: GameOpsMySQLPoolOverflow
        expr: increase(gameops_mysql_pool_overflow_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
          region: platform
        annotations:
          summary: "GameOps MySQL connection pool overflow"
          description: "The application borrowed more connections than the configured pool size."
          runbook: "Check request concurrency, slow queries, and tune GAMEOPS_MYSQL_POOL_SIZE if the managed MySQL limit allows it."

      - alert: GameOpsMySQLSlowQueries
        expr: increase(gameops_mysql_slow_queries_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
          region: platform
        annotations:
          summary: "GameOps application database operations are slow"
          description: "GameOps recorded database operations slower than GAMEOPS_MYSQL_SLOW_QUERY_SECONDS."
          runbook: "Review managed MySQL slow query logs and check connection pool saturation."

      - alert: GameOpsManagedMySQLDisabled
        expr: gameops_mysql_managed == 0
        for: 10m
        labels:
          severity: info
          region: platform
        annotations:
          summary: "GameOps is not configured for managed MySQL"
          description: "GAMEOPS_MYSQL_MANAGED is false. This is acceptable for local demos but not production."
          runbook: "Use the managed MySQL profile with automated backups, slow query logs, and TLS."
